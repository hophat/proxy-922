<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ProxyControl Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#197fe6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                        "surface-dark": "#1a2632",
                        "border-dark": "#344d65",
                        "text-muted": "#93adc8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Decoration -->
<div class="absolute inset-0 z-0">
<!-- Abstract network/map background -->
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&amp;w=2072&amp;auto=format&amp;fit=crop')] bg-cover bg-center opacity-10 dark:opacity-20" data-alt="Abstract digital network connections of the world map in blue tones"></div>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-background-light via-background-light/80 to-background-light/50 dark:from-background-dark dark:via-background-dark/90 dark:to-background-dark/60"></div>
</div>
<!-- Main Layout -->
<div class="relative z-10 flex flex-1 flex-col items-center justify-center p-4">
<div class="w-full max-w-[480px] flex flex-col gap-6">
<!-- Logo Section -->
<div class="flex flex-col items-center justify-center pb-2">
<div class="mb-4 flex h-16 w-16 items-center justify-center rounded-xl bg-primary shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-white text-[32px]">shield_lock</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white text-center">ProxyControl</h1>
<p class="mt-2 text-base font-normal text-slate-500 dark:text-text-muted text-center max-w-xs">
                    Secure access to your distributed network infrastructure
                </p>
</div>
<!-- Card -->
<div class="flex flex-col rounded-xl bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark shadow-2xl overflow-hidden">
<!-- Status Bar: Simulating a connection status -->
<div class="bg-primary/10 border-b border-primary/20 px-6 py-3 flex items-center gap-3">
<div class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
</div>
<span class="text-sm font-medium text-primary">Gateway Online</span>
<div class="ml-auto text-xs font-mono text-primary/70">US-EAST-1</div>
</div>
<div class="p-6 md:p-8 flex flex-col gap-6">
<!-- Username Field -->
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-white">Username or API Key</span>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-text-muted material-symbols-outlined text-[20px]">person</span>
<input autocomplete="username" class="w-full rounded-lg border border-gray-300 dark:border-border-dark bg-slate-50 dark:bg-[#111921] px-4 py-3 pl-11 text-base text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-text-muted focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary h-14 transition-all" placeholder="Enter your username" type="text"/>
</div>
</label>
<!-- Password Field -->
<label class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-sm font-medium text-slate-700 dark:text-white">Password</span>
<a class="text-xs font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-text-muted material-symbols-outlined text-[20px]">lock</span>
<input autocomplete="current-password" class="w-full rounded-lg border border-gray-300 dark:border-border-dark bg-slate-50 dark:bg-[#111921] px-4 py-3 pl-11 pr-12 text-base text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-text-muted focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary h-14 transition-all" placeholder="Enter your password" type="password"/>
<button class="absolute right-0 top-0 h-full px-4 text-slate-400 dark:text-text-muted hover:text-slate-600 dark:hover:text-white transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</label>
<!-- Dynamic Status Display Area -->
<!-- This area would be dynamically updated via JS in a real app. Showing a default 'Idle/Ready' state here. -->
<div class="hidden rounded-lg bg-red-500/10 border border-red-500/20 p-3 flex items-center gap-3" id="status-display">
<span class="material-symbols-outlined text-red-500 text-[20px]">error</span>
<span class="text-sm text-red-500 font-medium">Authentication failed. Invalid API Key.</span>
</div>
<!-- Login Button -->
<button class="group relative flex w-full items-center justify-center overflow-hidden rounded-lg bg-primary py-3.5 px-4 text-base font-bold text-white shadow-md transition-all hover:bg-primary/90 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark h-12">
<span class="absolute inset-0 flex items-center justify-center bg-primary opacity-0 transition-opacity group-active:opacity-100">
<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
</span>
<span class="group-active:opacity-0 flex items-center gap-2">
                            Log In
                            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</span>
</button>
</div>
<!-- Footer Support -->
<div class="bg-slate-50 dark:bg-[#111921]/50 border-t border-gray-200 dark:border-border-dark p-4 text-center">
<p class="text-sm text-slate-500 dark:text-text-muted">
                        Need help connecting? <a class="font-medium text-primary hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
<!-- Bottom Links -->
<div class="flex justify-center gap-6 text-sm text-slate-400 dark:text-slate-600">
<a class="hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Terms of Service</a>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">language</span> English
                </span>
</div>
</div>
</div>
</body></html>
