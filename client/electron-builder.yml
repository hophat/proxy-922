appId: com.Proxy96.client
productName: Proxy96 Client
directories:
  buildResources: build
  output: dist

# Enable asar để nén files (giảm kích thước đáng kể)
asar: true

# Compression level
compression: maximum

# Files to include - chỉ include những gì cần thiết
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json

# Exclude files không cần thiết
fileAssociations: []

win:
  target:
    - nsis
  icon: build/icon.png  # Will be converted to .ico automatically
  # Tối ưu kích thước cho Windows
  artifactName: "${productName} Setup ${version}.${ext}"

mac:
  target:
    - dmg
  category: public.app-category.utilities
  icon: build/icon.png  # Will be converted to .icns automatically
  # Chỉ build DMG, không build zip
  artifactName: "${productName}-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

dmg:
  writeUpdateInfo: false

