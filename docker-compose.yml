  #     POSTGRES_USER: ${POSTGRES_USER:-proxyadmin}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     POSTGRES_DB: ${POSTGRES_DB:-proxy992}
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
